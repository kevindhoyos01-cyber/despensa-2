<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi despensa</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<!-- Librería de Supabase desde unpkg (más confiable) -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#eef3ef;--card:#fff;--ink:#16322a;--mute:#5d7068;--line:#d6e0da;--brand:#1e6b4f;--onbrand:#fff;--full:#2f9e5b;--mid:#d99a14;--low:#d6452f;--out:#8a958f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b16;--card:#17261f;--ink:#e6f1eb;--mute:#93a89d;--line:#2a3d34;--brand:#5fc596;--onbrand:#0f1b16;--full:#45b872;--mid:#e5ad2e;--low:#ef6a55;--out:#7b887f}}
:root[data-theme="dark"]{--bg:#0f1b16;--card:#17261f;--ink:#e6f1eb;--mute:#93a89d;--line:#2a3d34;--brand:#5fc596;--onbrand:#0f1b16;--full:#45b872;--mid:#e5ad2e;--low:#ef6a55;--out:#7b887f}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:10px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--brand);color:var(--onbrand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:10px 0}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
.btn{border:0;background:var(--brand);color:var(--onbrand);font-weight:600;border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:none;color:var(--low);border:1px solid var(--low)}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;border-left:8px solid var(--out)}
.item.full{border-left-color:var(--full)}.item.mid{border-left-color:var(--mid)}.item.low{border-left-color:var(--low)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.name{font-weight:800;font-size:1.15rem;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.cat{color:var(--mute);font-size:.85rem}
.st{font-weight:600;font-size:.9rem}
.st.full{color:var(--full)}.st.mid{color:var(--mid)}.st.low{color:var(--low)}.st.out{color:var(--out)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--out)}
.bar.full i{background:var(--full)}.bar.mid i{background:var(--mid)}.bar.low i{background:var(--low)}
.use{display:flex;gap:8px;margin-top:8px}.use input{max-width:90px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.fab .btn{box-shadow:0 4px 14px rgba(0,0,0,.25);padding:14px 18px;border-radius:99px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;white-space:pre-wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
a{color:var(--brand);font-weight:600}
</style>
</head>
<body>

  <div id="header"></div>
  <div id="view"></div>
</div>
<div class="fab" id="fab"></div>
<div id="modal"></div>
