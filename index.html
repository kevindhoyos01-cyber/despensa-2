<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi despensa</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e6b4f">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<!-- Librería de Supabase desde unpkg (más confiable) -->
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#eef3ef;--card:#fff;--ink:#16322a;--mute:#5d7068;--line:#d6e0da;--brand:#1e6b4f;--onbrand:#fff;--full:#2f9e5b;--mid:#d99a14;--low:#d6452f;--out:#8a958f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b16;--card:#17261f;--ink:#e6f1eb;--mute:#93a89d;--line:#2a3d34;--brand:#5fc596;--onbrand:#0f1b16;--full:#45b872;--mid:#e5ad2e;--low:#ef6a55;--out:#7b887f}}
:root[data-theme="dark"]{--bg:#0f1b16;--card:#17261f;--ink:#e6f1eb;--mute:#93a89d;--line:#2a3d34;--brand:#5fc596;--onbrand:#0f1b16;--full:#45b872;--mid:#e5ad2e;--low:#ef6a55;--out:#7b887f}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:10px;border-radius:10px;cursor:pointer}
.tabs button.on{background:var(--brand);color:var(--onbrand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:10px 0}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 4px}
.btn{border:0;background:var(--brand);color:var(--onbrand);font-weight:600;border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.del{background:none;color:var(--low);border:1px solid var(--low)}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;border-left:8px solid var(--out)}
.item.full{border-left-color:var(--full)}.item.mid{border-left-color:var(--mid)}.item.low{border-left-color:var(--low)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.name{font-weight:800;font-size:1.15rem;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.cat{color:var(--mute);font-size:.85rem}
.st{font-weight:600;font-size:.9rem}
.st.full{color:var(--full)}.st.mid{color:var(--mid)}.st.low{color:var(--low)}.st.out{color:var(--out)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--out)}
.bar.full i{background:var(--full)}.bar.mid i{background:var(--mid)}.bar.low i{background:var(--low)}
.use{display:flex;gap:8px;margin-top:8px}.use input{max-width:90px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.fab .btn{box-shadow:0 4px 14px rgba(0,0,0,.25);padding:14px 18px;border-radius:99px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;white-space:pre-wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
a{color:var(--brand);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div id="header"></div>
  <div id="view"></div>
</div>
<div class="fab" id="fab"></div>
<div id="modal"></div>

<script>
// TUS CREDENCIALES
const SUPABASE_URL = "https://huvfflasvaalgewlpqny.supabase.co";
const SUPABASE_KEY = "sb_publishable_fKxh6DRI06AIEmXOfbeBnA_ljL5EBOF";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { flowType: 'implicit', persistSession: true, detectSessionInUrl: true }
});

const state = { user: null, products: [], supermarkets: [], categories: [], tab: 'p', cat: 'Todas', loading: true };
const $ = i => document.getElementById(i);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = parseFloat(String(v).replace(',','.')); return isNaN(n) ? 0 : n; };
const fmt = n => Math.round(n * 100) / 100;

function stat(p) {
  const r = p.capacity > 0 ? p.quantity / p.capacity : 0;
  if (p.quantity <= 0) return { k: 'out', t: 'Agotado', r: 0 };
  if (r > 0.6) return { k: 'full', t: 'Lleno', r };
  if (r > 0.3) return { k: 'mid', t: 'Se está acabando', r };
  return { k: 'low', t: 'Se va a acabar', r };
}

function storeUrl(s, p) {
  const u = s.search_template || s.url_base || '';
  if (u.includes('{q}')) return u.replace('{q}', encodeURIComponent(p.name));
  return u;
}

async function boot() {
  try {
    // 1. Quitamos la pantalla de carga y dibujamos el login de una vez
    state.loading = false;
    render();

    // 2. Revisamos la URL por si viene una invitación
    const m = location.search.match(/[?&]invite=([^&]+)/);
    if (m) { localStorage.setItem('pending_invite', m[1]); history.replaceState({}, '', location.pathname); }

    // 3. Revisamos si ya había una sesión iniciada
    const { data: { session } } = await sb.auth.getSession();
    if (session?.user) {
      state.user = session.user;
      await onLogin();
      render();
    }

    // 4. Escuchamos cambios en la sesión (login/logout)
    sb.auth.onAuthStateChange(async (_, session) => {
      const was = !!state.user;
      state.user = session?.user ?? null;
      if (state.user && !was) { await onLogin(); render(); }
      else if (!state.user && was) { state.products = []; state.supermarkets = []; render(); }
    });
  } catch (error) {
    console.error("Error al iniciar:", error);
    $('view').innerHTML = `<div style="text-align:center;padding:20px;color:red;">
      <h2>Error de conexión</h2>
      <p>${error.message}</p>
    </div>`;
  }
}

async function onLogin() {
  await Promise.all([loadData(), loadCategories()]);
  await processInvite();
}

async function loadData() {
  const [p, s] = await Promise.all([
    sb.from('products').select('*').order('created_at', { ascending: false }),
    sb.from('supermarkets').select('*').order('name')
  ]);
  state.products = p.data || [];
  state.supermarkets = s.data || [];
}

async function loadCategories() {
  const { data } = await sb.from('categories').select('*').order('name');
  state.categories = data || [];
}

async function processInvite() {
  const token = localStorage.getItem('pending_invite');
  if (!token) return;
  localStorage.removeItem('pending_invite');
  const { data: inv } = await sb.from('inventory_invites').select('*').eq('token', token).maybeSingle();
  if (!inv || inv.used || new Date(inv.expires_at) < new Date()) { alert('Invitación inválida o expirada'); return; }
  if (inv.owner_id === state.user.id) { alert('Es tu propia invitación'); return; }
  await sb.from('inventory_members').insert({ owner_id: inv.owner_id, member_id: state.user.id, role: inv.role });
  await sb.from('inventory_invites').update({ used: true }).eq('token', token);
  alert('¡Listo! Ahora compartes esta despensa.');
  await loadData();
}

function render() {
  if (state.loading) { $('header').innerHTML = ''; $('view').innerHTML = ''; $('fab').innerHTML = ''; return; }
  if (!state.user) {
    $('header').innerHTML = '';
    $('view').innerHTML = `<div style="max-width:400px;margin:60px auto;padding:0 8px"><h1 style="text-align:center">🥕 Mi despensa</h1><p class="sub" style="text-align:center">Entra con tu correo. Te enviamos un enlace mágico.</p><input id="email" type="email" placeholder="tucorreo@ejemplo.com" style="margin-bottom:10px"><button class="btn" id="btnsend" style="width:100%">Enviar enlace</button><p id="msg" class="cat" style="text-align:center;margin-top:14px"></p></div>`;
    $('fab').innerHTML = '';
    return;
  }
  $('header').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h1>🥕 Mi despensa</h1><div style="display:flex;gap:6px"><button class="btn alt" id="btninvite">Invitar</button><button class="btn alt" id="btnlogout">Salir</button></div></div><p class="sub" style="font-size:.8rem">${esc(state.user.email)}</p><div class="tabs"><button class="${state.tab==='p'?'on':''}" data-tab="p">Productos</button><button class="${state.tab==='s'?'on':''}" data-tab="s">Mis súpers</button></div>`;
  if (state.tab === 'p') renderProducts(); else renderSupermarkets();
}

function renderProducts() {
  let h = '<div class="chips"><button class="chip' + (state.cat==='Todas'?' on':'') + '" data-cat="Todas">Todas</button>';
  state.categories.forEach(c => { h += `<button class="chip${state.cat===c.name?' on':''}" data-cat="${esc(c.name)}">${esc(c.name)}</button>`; });
  h += '</div>';
  const catId = state.categories.find(c => c.name === state.cat)?.id;
  let list = state.products.filter(p => state.cat==='Todas' || p.category_id === catId);
  const order = { low: 0, mid: 1, out: 2, full: 3 };
  list.sort((a,b) => order[stat(a).k] - order[stat(b).k]);
  if (!list.length) h += '<div class="empty">Aún no hay productos. Toca "Añadir" para registrar el primero.</div>';
  list.forEach(p => {
    const s = stat(p);
    const cat = state.categories.find(c => c.id === p.category_id)?.name || '';
    const shared = p.user_id !== state.user.id ? ' <span class="cat">· compartido</span>' : '';
    h += `<div class="item ${s.k}"><div class="top"><button class="name" data-open="${p.id}">${esc(p.name)}</button><span class="st ${s.k}">${s.t}</span></div><div class="cat">${esc(cat)}${shared} · quedan ${fmt(p.quantity)} de ${fmt(p.capacity)} ${esc(p.unit)}</div><div class="bar ${s.k}"><i style="width:${Math.round(s.r*100)}%"></i></div><div class="use"><input type="number" inputmode="decimal" min="0" step="any" placeholder="Cantidad" id="u${p.id}"><button class="btn" data-use="${p.id}">Usé</button></div></div>`;
  });
  $('view').innerHTML = h;
  $('fab').innerHTML = `<button class="btn" id="addp">Añadir</button>`;
}

function renderSupermarkets() {
  let h = '<p class="sub">Tus súpers de siempre. En la ficha de cada producto verás un enlace para buscarlo en cada uno.</p>';
  if (!state.supermarkets.length) h += '<div class="empty">Aún no hay súpers. Toca "Añadir súper".</div>';
  state.supermarkets.forEach(s => {
    h += `<div class="item"><div class="top"><span class="name">${esc(s.name)}</span><a href="${esc(s.url_base||'')}" target="_blank" rel="noopener">Abrir web</a></div><div class="cat">${esc(s.search_template||s.url_base||'')}</div><div class="row" style="margin-top:8px"><button class="btn alt" data-es="${s.id}">Editar</button><button class="btn del" data-ds="${s.id}">Quitar</button></div></div>`;
  });
  $('view').innerHTML = h;
  $('fab').innerHTML = `<button class="btn" id="adds">Añadir súper</button>`;
}

function openModal(html) { $('modal').innerHTML = `<div class="ov" id="ov"><div class="sheet">${html}</div></div>`; }
function closeModal() { $('modal').innerHTML = ''; }

function showDetail(id) {
  const p = state.products.find(x => x.id === id); if (!p) return;
  const s = stat(p);
  const cat = state.categories.find(c => c.id === p.category_id)?.name || '';
  let h = `<div class="top"><h2 style="margin:0">${esc(p.name)}</h2><button class="btn alt" data-close="1">Cerrar</button></div><div class="cat">${esc(cat)}</div><div class="item ${s.k}" style="margin-top:10px"><div class="st ${s.k}">${s.t}</div><div class="bar ${s.k}"><i style="width:${Math.round(s.r*100)}%"></i></div><div>Quedan <b>${fmt(p.quantity)}</b> de ${fmt(p.capacity)} ${esc(p.unit)}</div><div class="use"><input type="number" inputmode="decimal" min="0" step="any" placeholder="Cantidad" id="dq"><button class="btn" data-duse="${p.id}">Usé</button><button class="btn alt" data-dadd="${p.id}">Repuse</button></div><div class="row" style="margin-top:8px"><button class="btn alt" data-full="${p.id}">Rellenar al máximo</button></div></div>`;
  if (p.ingredients) h += `<h3>Qué contiene</h3><div class="box">${esc(p.ingredients)}</div>`;
  if (p.allergens) h += `<h3>Alérgenos</h3><div class="box">${esc(p.allergens)}</div>`;
  h += '<h3>Buscar en mis súpers</h3><div class="row">';
  if (!state.supermarkets.length) h += '<span class="cat">Añade súpers en la pestaña "Mis súpers".</span>';
  state.supermarkets.forEach(x => { const url = storeUrl(x, p); if (url) h += `<a class="chip" href="${esc(url)}" target="_blank" rel="noopener">${esc(x.name)}</a>`; });
  h += '</div><h3>Etiqueta QR</h3><div class="qr" id="qr"></div><p class="cat">Código: <b>' + p.qr_token + '</b></p><div class="row"><button class="btn alt" data-edit="${p.id}">Editar</button><button class="btn del" data-del="${p.id}">Eliminar</button></div>';
  openModal(h);
  try { new QRCode($('qr'), { text: p.qr_token, width: 150, height: 150 }); } catch(e) { $('qr').textContent = 'QR no disponible'; }
}

function showForm(id) {
  const p = state.products.find(x => x.id === id) || { name: '', category_id: state.categories[0]?.id, unit: 'unidad', capacity: 1, quantity: 1, ingredients: '', allergens: '' };
  let optCat = state.categories.map(c => `<option value="${c.id}"${c.id===p.category_id?' selected':''}>${esc(c.name)}</option>`).join('');
  let optUnit = ['unidad','g','kg','ml','l'].map(u => `<option${u===p.unit?' selected':''}>${u}</option>`).join('');
  openModal(`<h2 style="margin:0 0 6px">${id?'Editar producto':'Nuevo producto'}</h2><label>Nombre</label><input id="fn" value="${esc(p.name)}"><div class="grid2"><div><label>Categoría</label><select id="fc">${optCat}</select></div><div><label>Unidad</label><select id="fu">${optUnit}</select></div><div><label>Cantidad llena</label><input id="fcap" type="number" inputmode="decimal" step="any" value="${p.capacity}"></div><div><label>Cantidad actual</label><input id="fcur" type="number" inputmode="decimal" step="any" value="${p.quantity}"></div></div><label>Umbral "se está acabando"</label><input id="flow" type="number" inputmode="decimal" step="any" value="${p.threshold_low||0}"><label>Umbral "se va a acabar"</label><input id="fcr" type="number" inputmode="decimal" step="any" value="${p.threshold_critical||0}"><label>Ingredientes / contenido</label><textarea id="fing">${esc(p.ingredients||'')}</textarea><label>Alérgenos</label><input id="fal" value="${esc(p.allergens||'')}"><div class="row" style="margin-top:14px"><button class="btn" data-savep="${id||''}">Guardar</button><button class="btn alt" data-close="1">Cancelar</button></div>`);
}

function showSuperForm(id) {
  const s = state.supermarkets.find(x => x.id === id) || { name: '', url_base: 'https://', search_template: '' };
  openModal(`<h2 style="margin:0 0 6px">${id?'Editar súper':'Nuevo súper'}</h2><label>Nombre</label><input id="sn" value="${esc(s.name)}"><label>Página web</label><input id="su" type="url" value="${esc(s.url_base)}"><label>Plantilla de búsqueda (opcional)</label><input id="st" value="${esc(s.search_template||'')}" placeholder="https://tusuper.com/buscar?q={q}"><p class="cat">Si rellenas la plantilla, el botón del producto te llevará directo a la búsqueda.</p><div class="row"><button class="btn" data-saves="${id||''}">Guardar</button><button class="btn alt" data-close="1">Cancelar</button></div>`);
}

async function showInvite() {
  const { data, error } = await sb.from('inventory_invites').insert({ owner_id: state.user.id }).select().single();
  if (error) { alert(error.message); return; }
  const url = `${location.origin}${location.pathname}?invite=${data.token}`;
  openModal(`<h2 style="margin:0 0 6px">Invitar a compartir</h2><p class="cat">Comparte este enlace. Quien lo abra y entre con su correo podrá ver y editar tu despensa.</p><div class="box" style="word-break:break-all">${esc(url)}</div><p class="cat">Caduca en 7 días.</p><div class="row"><button class="btn" id="btncopy">Copiar enlace</button><button class="btn alt" data-close="1">Cerrar</button></div>`);
  $('btncopy').onclick = () => { navigator.clipboard.writeText(url); $('btncopy').textContent = '¡Copiado!'; };
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button,a'); if (!t) return;
  const d = t.dataset;

  if (t.id === 'btnsend') {
    const email = $('email').value.trim(); 
    if (!email) return;
    t.disabled = true;
    $('msg').textContent = 'Enviando...';
    try {
      const currentUrl = window.location.origin + window.location.pathname;
      const redirectUrl = currentUrl.endsWith('/') ? currentUrl : currentUrl + '/';
      
      const { error } = await sb.auth.signInWithOtp({ 
        email, 
        options: { emailRedirectTo: redirectUrl } 
      });
      t.disabled = false;
      if (error) {
        $('msg').textContent = 'Error: ' + error.message;
      } else {
        $('msg').textContent = '¡Listo! Revisa tu correo 📬';
      }
    } catch (err) {
      t.disabled = false;
      $('msg').textContent = 'Fallo de conexión: ' + err.message;
    }
    return;
  }
  
  if (t.id === 'btnlogout') { await sb.auth.signOut(); return; }
  if (t.id === 'btninvite') { await showInvite(); return; }
  if (d.tab) { state.tab = d.tab; render(); return; }
  if (d.cat) { state.cat = d.cat; render(); return; }
  if (t.id === 'addp') { showForm(); return; }
  if (t.id === 'adds') { showSuperForm(); return; }
  if (d.close) { closeModal(); return; }
  if (d.open) { showDetail(d.open); return; }
  if (d.edit) { showForm(d.edit); return; }
  if (d.es) { showSuperForm(d.es); return; }

  if (d.use) {
    const n = num($('u' + d.use).value); if (!n) return;
    await sb.rpc('apply_movement', { p_product_id: d.use, p_delta: -n, p_type: 'uso' });
    await loadData(); render(); return;
  }
  if (d.duse || d.dadd) {
    const id = d.duse || d.dadd, n = num($('dq').value); if (!n) return;
    await sb.rpc('apply_movement', { p_product_id: id, p_delta: d.duse ? -n : n, p_type: d.duse ? 'uso' : 'reposicion' });
    await loadData(); render(); showDetail(id); return;
  }
  if (d.full) {
    const p = state.products.find(x => x.id === d.full); if (!p) return;
    const delta = p.capacity - p.quantity;
    if (delta) await sb.rpc('apply_movement', { p_product_id: p.id, p_delta: delta, p_type: 'reposicion' });
    await loadData(); render(); showDetail(d.full); return;
  }
  if (d.del) {
    if (t.dataset.sure) {
      await sb.from('products').delete().eq('id', d.del);
      await loadData(); closeModal(); render();
    } else { t.dataset.sure = 1; t.textContent = 'Confirmar eliminar'; }
    return;
  }
  if (t.hasAttribute('data-savep')) {
    const name = $('fn').value.trim(); if (!name) { $('fn').focus(); return; }
    const payload = {
      name,
      category_id: $('fc').value || null,
      unit: $('fu').value,
      capacity: num($('fcap').value) || 1,
      quantity: num($('fcur').value),
      threshold_low: num($('flow').value),
      threshold_critical: num($('fcr').value),
      ingredients: $('fing').value.trim() || null,
      allergens: $('fal').value.trim() || null,
    };
    if (d.savep) await sb.from('products').update(payload).eq('id', d.savep);
    else await sb.from('products').insert({ ...payload, user_id: state.user.id });
    await loadData(); closeModal(); render(); return;
  }
  if (t.hasAttribute('data-saves')) {
    const name = $('sn').value.trim(); if (!name) { $('sn').focus(); return; }
    const payload = { name, url_base: $('su').value.trim() || null, search_template: $('st').value.trim() || null };
    if (d.saves) await sb.from('supermarkets').update(payload).eq('id', d.saves);
    else await sb.from('supermarkets').insert({ ...payload, user_id: state.user.id });
    await loadData(); closeModal(); render(); return;
  }
  if (d.ds) { await sb.from('supermarkets').delete().eq('id', d.ds); await loadData(); render(); return; }
});

document.addEventListener('mousedown', e => { if (e.target.id === 'ov') closeModal(); });

boot();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}
</script>
</body>
